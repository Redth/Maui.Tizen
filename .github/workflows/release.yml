name: Release Maui.Tizen packages

# ---------------------------------------------------------------------------
# STATUS: SKELETON / SAFELY GATED — DO NOT ENABLE PUBLISHING YET.
#
# This workflow defines the *shape* of the Maui.Tizen release pipeline:
# build -> validate -> pack (unsigned, always runs) -> device-validation ->
# release-gate -> sign -> publish, with organization environment approvals
# gating the risk-bearing stages (release-gate, sign, publish). Ordinary
# manual runs — build, validate, and pack — succeed with no credentials and
# produce unsigned CI packages as workflow artifacts for inspection/testing.
# It intentionally cannot publish a signed, real package today:
#
#   1. `device-validation`, `release-gate`, `sign` and `publish` all require
#      the literal "PUBLISH" confirmation input - a typo-proof,
#      accidental-trigger-proof confirmation, not just a boolean checkbox.
#      Without it, the run stops after `pack` with unsigned artifacts only.
#   2. `device-validation` calls the reusable
#      `.github/workflows/tizen-device-validation.yml` workflow with
#      `release_validation: true`, which fails unless every release-gating
#      Tizen profile actually ran and passed on real hardware (see that
#      workflow's own `release-gate` job and
#      `eng/validation/scripts/evaluate-release-gate.sh`) - a real result,
#      not a description of one.
#   3. `release-gate` requires the `tizen-release` environment (human
#      approval) and only runs once `device-validation` has actually
#      succeeded.
#   4. `sign` requires the `nuget-signing` environment and `publish`
#      requires the `nuget-production` environment - none of the three
#      environments referenced by this workflow (`tizen-release`,
#      `nuget-signing`, `nuget-production`) exist in this repository yet
#      (create them only after
#      docs/governance/package-metadata-conventions.md's ownership/signing
#      items are resolved).
#   5. This workflow only runs on `workflow_dispatch` (manual) - it is not
#      wired to tags/releases yet, so it cannot fire unintentionally from a
#      push or PR.
#
# Before enabling real signing/publishing, complete:
#   - docs/governance/package-metadata-conventions.md (package IDs, signing,
#     trusted publishing)
#   - docs/governance/samsung-transfer-checklist.md sections 2, 4, 5 (or the
#     interim equivalents, if publishing before transfer)
#   - Create the `tizen-release`, `nuget-signing` and `nuget-production`
#     GitHub Environments with required reviewers configured.
#   - Provision the self-hosted `[self-hosted, tizen]` device runners and
#     the `tizen-device-lab` environment that
#     `.github/workflows/tizen-device-validation.yml` depends on, and set
#     `vars.TIZEN_DEVICE_LAB_ENABLED`/`vars.TIZEN_CATALOG_PROJECT`.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      package_version:
        description: >-
          Package version to build/pack (SemVer, e.g. 11.0.0-preview.1).
          Must follow docs/governance/versioning-policy.md.
        required: true
        type: string
      confirm_publish:
        description: >-
          Type PUBLISH (all caps) to allow the device-validation,
          release-gate, sign and publish jobs to run. Any other value stops
          the run after producing unsigned, validated CI packages
          (build/validate/pack only).
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  # -------------------------------------------------------------------------
  # Build & unit test. No environment gate - always safe to run.
  #
  # Delegates to the foundation workstream's own workload-free build lane
  # (eng/build-workload-free.sh, the same entrypoint used by
  # .github/workflows/ci.yml) instead of duplicating build logic here. That
  # script builds/tests everything that does not require the Samsung Tizen
  # workload; it does not build the net11.0-tizen11.0 packages themselves,
  # because the Samsung workload manifest
  # (samsung.net.sdk.tizen.manifest-11.0.100, see eng/baselines.json) is not
  # yet published. See docs/migration.md for the external-gate status.
  # -------------------------------------------------------------------------
  build:
    name: Build & test
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ inputs.package_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build and validate (workload-free lane)
        run: ./eng/build-workload-free.sh
        env:
          ContinuousIntegrationBuild: true

      - name: Note requested package version
        run: |
          echo "Requested package version: ${{ inputs.package_version }}"
          echo "Actual net11.0-tizen11.0 build/pack remains blocked on the Samsung workload manifest - see eng/baselines.json."

  # -------------------------------------------------------------------------
  # API compatibility / support-matrix / metadata validation.
  # No environment gate - read-only checks against the built output.
  # -------------------------------------------------------------------------
  validate:
    name: Validate (API compat, support matrix, package metadata)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check governance docs are present
        run: |
          test -f docs/governance/versioning-policy.md
          test -f docs/governance/api-compatibility-policy.md
          test -f docs/governance/tizen-support-matrix.md
          echo "Governance docs present."

      - name: Check TFM/SDK-band alignment with eng/baselines.json
        run: |
          python3 - <<'PY'
          import json

          baselines = json.load(open("eng/baselines.json"))
          target = baselines["target"]
          print(f"eng/baselines.json target TFM: {target['targetFramework']}")
          print(f"eng/baselines.json SDK band:   {target['sdkBand']}")
          print(f"eng/baselines.json package ID prefix: {baselines['policy']['packageIdPrefix']}")

          # docs/governance/versioning-policy.md documents net11.0-tizen11.0 as the
          # primary versioned TFM - keep this check aligned with that policy so the
          # two cannot silently drift apart.
          expected_tfm = "net11.0-tizen11.0"
          if target["targetFramework"] != expected_tfm:
              raise SystemExit(
                  f"eng/baselines.json targetFramework is '{target['targetFramework']}', "
                  f"expected '{expected_tfm}' per docs/governance/versioning-policy.md"
              )
          PY

      - name: API compatibility check (placeholder)
        run: |
          echo "TODO: run Microsoft.DotNet.ApiCompat (or equivalent) against the last shipped stable version."
          echo "See docs/governance/api-compatibility-policy.md section 2."

      - name: Support matrix freshness check (placeholder)
        run: |
          echo "TODO: fail this step if docs/governance/tizen-support-matrix.md still contains TBD"
          echo "for any profile targeted by this release. Intentionally non-blocking until wired up."

  # -------------------------------------------------------------------------
  # Pack the validated build output into UNSIGNED .nupkg/.snupkg artifacts
  # and upload them for inspection/testing. No environment gate - this is
  # the normal end state of a manual run that does not request publishing,
  # so contributors can produce and inspect CI packages without needing any
  # signing credential or approval.
  #
  # The workload transition is delegated to the same fail-closed script used
  # by CI. It probes the exact Samsung manifest IDs, installs a published
  # manifest through Samsung's commit-pinned supported installer from #310,
  # verifies the installed manifest through ReportTizenWorkload, and invokes
  # eng/build-tizen.sh. It never uses the unrelated `tizen` workload alias.
  # -------------------------------------------------------------------------
  pack:
    name: Pack (unsigned CI packages)
    runs-on: ubuntu-latest
    needs: [build, validate]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install, verify, build and pack through the workload transition gate
        env:
          PackageVersion: ${{ needs.build.outputs.package_version }}
        run: ./eng/ci/tizen-workload-gate.sh

      - name: Stage the exact unsigned shipping artifact
        id: unsigned
        run: |
          set -euo pipefail
          shopt -s nullglob

          packages=(
            artifacts/packages/Maui.Tizen.*.nupkg
            artifacts/packages/Maui.Tizen.*.snupkg
          )

          if (( ${#packages[@]} == 0 )); then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No shipping packages were produced; the Samsung workload remains externally gated."
            exit 0
          fi

          rm -rf artifacts/release-unsigned
          mkdir -p artifacts/release-unsigned
          cp -- "${packages[@]}" artifacts/release-unsigned/
          (
            cd artifacts/release-unsigned
            shasum -a 256 Maui.Tizen.*.nupkg Maui.Tizen.*.snupkg > SHA256SUMS
          )
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Require real packages when publishing is requested
        if: ${{ inputs.confirm_publish == 'PUBLISH' && steps.unsigned.outputs.available != 'true' }}
        run: |
          echo "::error::Publishing was requested, but the exact unsigned shipping artifact does not exist."
          exit 1

      - name: Upload the exact unsigned package artifact
        if: steps.unsigned.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: maui-tizen-packages-unsigned-${{ needs.build.outputs.package_version }}
          path: artifacts/release-unsigned
          if-no-files-found: error
          retention-days: 90

  # -------------------------------------------------------------------------
  # Consume the real device validation gate. Only runs when publishing is
  # requested (device runs are slow and require hardware, so they are not
  # part of the always-safe build/validate/pack lane). This calls the
  # reusable workflow directly - it does not merely describe a gate or
  # trigger validation after the fact on a tag: `release_validation: true`
  # makes that workflow's own `release-gate` job fail the call unless every
  # release-gating Tizen profile (per
  # eng/validation/profiles/tizen-profiles.json) actually ran on real
  # hardware and passed - see
  # .github/workflows/tizen-device-validation.yml and
  # eng/validation/scripts/evaluate-release-gate.sh for how that job
  # decides pass/fail (per-profile result artifacts, not job outputs, so a
  # skipped/unavailable profile cannot masquerade as a pass).
  # -------------------------------------------------------------------------
  device-validation:
    name: Tizen device validation (release gate input)
    needs: pack
    if: ${{ inputs.confirm_publish == 'PUBLISH' }}
    uses: ./.github/workflows/tizen-device-validation.yml
    with:
      release_validation: true

  # -------------------------------------------------------------------------
  # Human approval gate. Requires the `tizen-release` GitHub Environment
  # (required reviewers) and only runs once `device-validation` has
  # actually succeeded - i.e. real hardware validation passed, not merely
  # that this workflow was triggered from a tag. This environment does not
  # exist in the repository yet; creating it (with real reviewers) is
  # itself a transfer/activation-readiness action tracked in
  # docs/governance/samsung-transfer-checklist.md.
  # -------------------------------------------------------------------------
  release-gate:
    name: Release approval gate
    runs-on: ubuntu-latest
    needs: device-validation
    if: ${{ inputs.confirm_publish == 'PUBLISH' }}
    environment: tizen-release
    steps:
      - name: Confirm device validation passed
        run: |
          echo "Tizen device validation (.github/workflows/tizen-device-validation.yml release-gate job) succeeded."
          echo "Approved to proceed to signing/publishing via the tizen-release environment."

  # -------------------------------------------------------------------------
  # Code + package signing. Only runs when the caller explicitly typed
  # "PUBLISH" and only after the device validation / release approval gate
  # above has succeeded. Requires the `nuget-signing` environment, which
  # should be configured with required reviewers and an organization-owned
  # signing credential (never a personal certificate - see
  # docs/governance/package-metadata-conventions.md section 3). This
  # environment does not exist in the repository yet, so this job cannot
  # currently succeed even when "PUBLISH" is typed - that is intentional.
  #
  # Signing must happen before publish, never the reverse: this job
  # downloads the exact UNSIGNED artifact `pack` produced (not a rebuild),
  # so what gets signed is what was actually validated, and `publish` below
  # can only ever download a SIGNED artifact - there is no path from
  # `pack`'s unsigned output straight to `publish`.
  # -------------------------------------------------------------------------
  sign:
    name: Sign packages (production only)
    runs-on: ubuntu-latest
    needs: [release-gate, build]
    if: ${{ inputs.confirm_publish == 'PUBLISH' }}
    environment: nuget-signing
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the unsigned packages produced by pack
        uses: actions/download-artifact@v4
        with:
          name: maui-tizen-packages-unsigned-${{ needs.build.outputs.package_version }}
          path: artifacts/unsigned

      - name: Verify the exact unsigned artifact
        run: |
          set -euo pipefail
          cd artifacts/unsigned
          shasum -a 256 --check SHA256SUMS

      - name: Sign (placeholder - fails closed)
        run: |
          echo "No organization signing credential is configured yet."
          echo "See docs/governance/package-metadata-conventions.md section 3."
          echo "This step fails intentionally so packages cannot be mistaken for signed."
          exit 1

      # Replace only the fail-closed step above with the organization signing
      # service. It must write the signed copies to artifacts/signed; the active
      # verification, provenance and upload steps below are intentionally not
      # optional and must remain fail-closed.

      - name: Verify signed packages and record their exact hashes
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(artifacts/signed/Maui.Tizen.*.nupkg artifacts/signed/Maui.Tizen.*.snupkg)
          (( ${#packages[@]} > 0 ))
          dotnet nuget verify --all "${packages[@]}"
          (
            cd artifacts/signed
            shasum -a 256 Maui.Tizen.*.nupkg Maui.Tizen.*.snupkg > SHA256SUMS
          )

      - name: Generate build provenance for the signed packages
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            artifacts/signed/Maui.Tizen.*.nupkg
            artifacts/signed/Maui.Tizen.*.snupkg

      - name: Upload the exact signed package artifact
        uses: actions/upload-artifact@v4
        with:
          name: maui-tizen-packages-signed-${{ needs.build.outputs.package_version }}
          path: artifacts/signed
          if-no-files-found: error
          retention-days: 90

  # -------------------------------------------------------------------------
  # Publish. Double-gated: requires both the `nuget-production` environment
  # (required reviewers) AND the literal "PUBLISH" confirmation input, and
  # only runs after `sign` has produced signed artifacts. This environment
  # does not exist in the repository yet - creating it is itself a
  # transfer-readiness action tracked in
  # docs/governance/samsung-transfer-checklist.md.
  #
  # This job can only ever push what `sign` uploaded under the
  # `maui-tizen-packages-signed-*` artifact name - there is deliberately no
  # fallback to the `pack` job's `maui-tizen-packages-unsigned-*` artifact,
  # so an unsigned package can never reach nuget.org through this workflow.
  # -------------------------------------------------------------------------
  publish:
    name: Publish to NuGet (disabled until ownership/signing finalized)
    runs-on: ubuntu-latest
    needs: [sign, build]
    if: ${{ inputs.confirm_publish == 'PUBLISH' }}
    environment: nuget-production
    permissions:
      contents: read
      id-token: write
      attestations: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the signed packages produced by sign
        uses: actions/download-artifact@v4
        with:
          name: maui-tizen-packages-signed-${{ needs.build.outputs.package_version }}
          path: artifacts/signed

      - name: Verify signed artifact hashes, signatures and provenance
        run: |
          set -euo pipefail
          cd artifacts/signed
          shasum -a 256 --check SHA256SUMS
          shopt -s nullglob
          packages=(Maui.Tizen.*.nupkg Maui.Tizen.*.snupkg)
          (( ${#packages[@]} > 0 ))
          dotnet nuget verify --all "${packages[@]}"
          for package in "${packages[@]}"; do
            gh attestation verify "$package" --repo "$GITHUB_REPOSITORY"
          done

      - name: Guard - publishing prerequisites
        run: |
          echo "Publishing is not yet enabled for this repository."
          echo "Prerequisites tracked in docs/governance/package-metadata-conventions.md"
          echo "and docs/governance/samsung-transfer-checklist.md must be satisfied,"
          echo "and this guard step must be replaced with a real check, before removing this exit."
          exit 1

      # The guard step above always exits 1 today. Once ownership and trusted
      # publishing are configured, replace only that guard with the push:
      #
      # - name: Publish via trusted publishing
      #   run: |
      #     echo "dotnet nuget push using nuget.org Trusted Publishing (OIDC)."
      #     echo "No API key secret should ever be added here - see"
      #     echo "docs/governance/package-metadata-conventions.md section 4."
