name: CI

on:
  push:
    branches: [ main ]
  # Deliberately unrestricted: stacked PRs target the foundation branch rather than
  # main, and a `branches: [ main ]` filter here silently gives them zero checks -
  # which is worse than a failing check, because nothing signals that anything is wrong.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # ---------------------------------------------------------------------------
  # The lane that must stay green.
  #
  # It builds and tests everything that does not depend on the Samsung Tizen workload,
  # which is what stops the repository's build configuration from sitting untested
  # while we wait on an external dependency.
  # ---------------------------------------------------------------------------
  workload-free:
    name: Build and test (no Tizen workload)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: the provenance tests and any history verification need the
          # imported commits, not a shallow tip.
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build and validate
        run: ./eng/build-workload-free.sh
        env:
          ContinuousIntegrationBuild: true

  # ---------------------------------------------------------------------------
  # Hosted validation lane.
  #
  # Everything the validation harness can prove without a Tizen workload or a device:
  # repository contract consistency, packaging and package-content contracts, dependency
  # policy, MSBuild/buildTransitive behaviour, handler/DI/Essentials convention engines,
  # the DevFlow API contract, and consumer restore.
  #
  # Suites here skip individual tests when their subject does not exist yet, and every skip
  # carries a reason naming what is missing and which lane covers it. The run summary lists
  # them, because a suite that quietly skips everything is the failure mode this lane exists
  # to prevent.
  # ---------------------------------------------------------------------------
  hosted-validation:
    name: Hosted validation (no Tizen workload)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Run hosted validation suites
        run: ./eng/validation/run-hosted-validation.sh
        env:
          ContinuousIntegrationBuild: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-validation-results
          path: artifacts/test-results/
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Device lane status, surfaced on every build.
  #
  # The real device lane lives in tizen-device-validation.yml and runs on self-hosted
  # Samsung infrastructure that is deliberately NOT attached to ordinary pull requests.
  # This job reports that fact rather than letting the lane silently not exist.
  # ---------------------------------------------------------------------------
  device-lane-status:
    name: Tizen device lane (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Report device lane availability
        run: |
          set -euo pipefail
          {
            echo "## Tizen device lane"
            echo
            if [ "${{ vars.TIZEN_DEVICE_LAB_ENABLED }}" = "true" ]; then
              echo ":white_check_mark: A device lab is configured for this repository."
              echo "The lane runs in \`tizen-device-validation.yml\`."
            else
              echo ":hourglass: **No device lab is attached — expected for pull requests.**"
              echo
              echo "Device-dependent validation (TPK creation, emulator/device deploy and run,"
              echo "visual baselines, TV remote focus traversal, live handler parity) runs in"
              echo "\`tizen-device-validation.yml\` on self-hosted Samsung infrastructure."
              echo
              echo "It is **not required** for pull requests and **is required** for a release,"
              echo "through the \`tizen-release\` environment. See \`docs/validation/ci.md\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Provenance integrity.
  #
  # The import's value is entirely in the history it preserves. If a future rebase or
  # force-push flattens it, everything still compiles and nothing else notices - so it
  # is checked explicitly.
  # ---------------------------------------------------------------------------
  provenance:
    name: Verify imported history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify provenance commits are still reachable
        run: |
          set -euo pipefail
          fail=0

          check_pr() {
            local pr="$1" desc="$2" matches
            # NOTE: deliberately NOT `git log ... | grep -q .`. Under `set -o pipefail`,
            # `grep -q` exits on the first match and closes the pipe, so `git log` can die
            # with SIGPIPE and poison the pipeline's exit status - nondeterministically,
            # depending on how much it had already written. That is exactly how this check
            # first failed in CI: #2360 passed and #9619 "went missing" in the same run.
            # `wc -l` consumes all input, so there is no early close and no race.
            matches="$(git log --all --format='%H' --grep="#${pr})" | wc -l)"
            if [ "$matches" -gt 0 ]; then
              echo "  OK   PR #${pr} (${desc}) is present in history"
            else
              echo "  FAIL PR #${pr} (${desc}) is missing - imported history has been flattened or rewritten"
              fail=1
            fi
          }

          check_pr 2360 "Adds Tizen backend"
          check_pr 9619 "Replace Tizen Backend engine"

          # The import should carry well over a thousand commits. A shallow or squashed
          # history is the failure this guards against.
          commits=$(git rev-list --count HEAD)
          echo "  INFO $commits commits reachable from HEAD"
          if [ "$commits" -lt 1000 ]; then
            echo "  FAIL history looks truncated (expected >1000 commits from the Tizen import)"
            fail=1
          fi

          # Attribution is the point of a history-preserving import.
          authors=$(git log --format='%aN' | sort -u | wc -l)
          echo "  INFO $authors distinct authors preserved"
          if [ "$authors" -lt 50 ]; then
            echo "  FAIL author attribution looks lost (expected >50 distinct authors)"
            fail=1
          fi

          exit $fail

  # ---------------------------------------------------------------------------
  # Full-framework MSBuild.
  #
  # THE ACKNOWLEDGED GAP, RUN FOR REAL RATHER THAN SIMULATED.
  #
  # Maui.Tizen.Build.Tasks runs inside whatever MSBuild host loads it. Visual Studio and
  # MSBuild.exe are .NET FRAMEWORK hosts, where System.Runtime.InteropServices.NativeLibrary
  # does not exist, so the resolver the tasks register on .NET cannot be used and the native
  # SkiaSharp binary has to be preloaded through the OS loader instead. That difference is
  # not observable from the test suite: the tests run on .NET, and MSBuild.exe does not exist
  # on macOS or Linux.
  #
  # SkiaSharpHostTests covers the host-independent half (the candidate list resolves to a
  # real binary that the OS loader accepts). The remaining half - the tasks actually
  # executing under MSBuild.exe - can only be run on a Windows agent, so it is run on a
  # Windows agent. It is deliberately NOT faked locally with a stub host or a conditional
  # skip: a green check that proves nothing is worse than a missing one.
  #
  # What it runs is the PACKAGE, not the source tree: the probe project references the nupkg
  # this job packs, so the buildTransitive auto-import, the packaged task assembly path and
  # the shipped managed dependency closure are all exercised as a consumer would get them.
  #
  # ENFORCEMENT of that closure does not live here. `PackageContentTests` reads the produced
  # package's assemblies and fails the required workload-free lane if any reference resolves
  # neither inside the package nor from the MSBuild host, which is a check that runs on every
  # platform. This job is the EXECUTION proof of the same property on the host where it
  # actually matters, and it stays advisory only because it depends on the Visual Studio
  # MSBuild present on the runner image. Promote it to required once it has been stable for
  # a few runs.
  # ---------------------------------------------------------------------------
  windows-full-framework:
    name: Build tasks under full-framework MSBuild (final lane)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: microsoft/setup-msbuild@v2

      - name: Pack the tasks
        # PACK, not just build.
        #
        # This lane used to build the tasks and then point the probe project's
        # _MauiTizenBuildTasksAssembly at artifacts/bin/.../netstandard2.0. That directory
        # holds the FULL runtime closure (CopyLocalLockFileAssemblies), so the probe loaded
        # System.Memory and friends from beside the task assembly whether or not the package
        # shipped them - and the package did not. The one lane that could have caught the
        # gap was arranged so that it could not.
        run: dotnet pack src/Maui.Tizen.Build.Tasks/Maui.Tizen.Build.Tasks.csproj -c Release -o "${{ runner.temp }}/local-feed"

      - name: Rasterize through MSBuild.exe
        shell: pwsh
        run: |
          # A minimal project that opts into the external-backend contract and drives the
          # image, splash and manifest generators - i.e. the code paths that call into
          # native SkiaSharp from inside the task assembly.
          #
          # The backend arrives as a PackageReference to the nupkg produced above, so what
          # runs here is the packaged layout: NuGet's automatic buildTransitive import, the
          # task assembly at the path the packaged targets compute, and the managed
          # dependency closure the package ships. On .NET Framework MSBuild that closure is
          # not optional - System.Memory, System.Buffers, System.Numerics.Vectors and
          # System.Runtime.CompilerServices.Unsafe are provided by the .NET MSBuild's shared
          # framework and by nothing here.
          $ErrorActionPreference = 'Stop'

          $feed = Join-Path $env:RUNNER_TEMP 'local-feed'
          $nupkg = Get-ChildItem $feed -Filter 'Maui.Tizen.Build.Tasks.*.nupkg' |
            Where-Object { $_.Name -notlike '*.symbols.nupkg' } |
            Select-Object -First 1
          if (-not $nupkg) { throw "No Maui.Tizen.Build.Tasks package was produced in $feed." }

          $version = $nupkg.BaseName -replace '^Maui\.Tizen\.Build\.Tasks\.', ''
          Write-Host "Consuming Maui.Tizen.Build.Tasks $version from $feed"

          $probe = Join-Path $env:RUNNER_TEMP 'fullframework-probe'
          New-Item -ItemType Directory -Force -Path $probe | Out-Null
          Set-Content (Join-Path $probe 'Directory.Build.props')   '<Project />'
          Set-Content (Join-Path $probe 'Directory.Build.targets') '<Project />'

          # The repository's own feeds plus the local one, mapped so the local feed can only
          # ever serve this repository's package IDs.
          $config = Get-Content nuget.config -Raw
          $config = $config -replace '</packageSources>', ("    <add key=""local"" value=""$feed"" />`r`n  </packageSources>")
          $config = $config -replace '</packageSourceMapping>', ("    <packageSource key=""local"">`r`n      <package pattern=""Maui.Tizen.*"" />`r`n    </packageSource>`r`n  </packageSourceMapping>")
          Set-Content (Join-Path $probe 'NuGet.config') $config

          $app = Join-Path $probe 'TizenApp'
          New-Item -ItemType Directory -Force -Path (Join-Path $app 'Resources\AppIcon') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $app 'Resources\Splash') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $app 'Platforms\Tizen') | Out-Null

          $svg = '<?xml version="1.0" encoding="UTF-8" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128"><rect width="128" height="128" fill="#512BD4" /></svg>'
          Set-Content (Join-Path $app 'Resources\AppIcon\appicon.svg') $svg
          Set-Content (Join-Path $app 'Resources\Splash\splash.svg')   $svg
          Set-Content (Join-Path $app 'Program.cs') 'internal class Program { private static void Main() { } }'

          @'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest package="maui-application-id-placeholder" version="0.0.0" api-version="11" xmlns="http://tizen.org/ns/packages">
            <profile name="common" />
            <ui-application appid="maui-application-id-placeholder" exec="TizenApp.dll" multiple="false" nodisplay="false" taskmanage="true" type="dotnet" launch_mode="single">
              <label>maui-application-title-placeholder</label>
              <icon>maui-appicon-placeholder</icon>
            </ui-application>
          </manifest>
          '@ | Set-Content (Join-Path $app 'Platforms\Tizen\tizen-manifest.xml')

          $resizetizer = ([xml](Get-Content Directory.Packages.props)).
            SelectSingleNode("//PackageVersion[@Include='Microsoft.Maui.Resizetizer']").Version

          # No Import of this package and no _MauiTizenBuildTasksAssembly override: the
          # buildTransitive auto-import is part of what is being tested.
          @"
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net11.0</TargetFramework>
              <OutputType>Exe</OutputType>
              <ResizetizerPlatformType>tizen</ResizetizerPlatformType>
              <ApplicationId>com.contoso.fullframework</ApplicationId>
              <ApplicationTitle>Contoso</ApplicationTitle>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Microsoft.Maui.Resizetizer" Version="$resizetizer" />
              <PackageReference Include="Maui.Tizen.Build.Tasks" Version="$version" />
            </ItemGroup>
            <ItemGroup>
              <MauiIcon Include="Resources\AppIcon\appicon.svg" Color="#512BD4" />
              <MauiSplashScreen Include="Resources\Splash\splash.svg" Color="#512BD4" BaseSize="128,128" />
            </ItemGroup>
          </Project>
          "@ | Set-Content (Join-Path $app 'TizenApp.csproj')

          # An isolated packages folder: the produced package's version does not change
          # between runs, so a shared folder could serve an older extraction of it.
          $env:NUGET_PACKAGES = Join-Path $env:RUNNER_TEMP 'packages'

          dotnet restore (Join-Path $app 'TizenApp.csproj')
          if ($LASTEXITCODE -ne 0) { throw 'restore failed' }

          # msbuild.exe, NOT dotnet build: running it on .NET would exercise the host this
          # lane exists to be different from.
          msbuild (Join-Path $app 'TizenApp.csproj') /nologo /v:m /nodeReuse:false
          if ($LASTEXITCODE -ne 0) { throw 'full-framework MSBuild build failed' }

          $generated = Join-Path $app 'obj\Debug\net11.0\maui-tizen'
          $splash = Get-ChildItem (Join-Path $generated 'splash') -Filter *.png -ErrorAction SilentlyContinue
          if (-not $splash) { throw 'No splash screens were rasterized under full-framework MSBuild.' }

          $manifest = Get-Content (Join-Path $generated 'tizen-manifest.xml') -Raw
          if ($manifest -match 'maui-application-id-placeholder') {
            throw 'The generated manifest still contains placeholder tokens.'
          }

          Write-Host "Rasterized $($splash.Count) splash screen(s) under full-framework MSBuild."

  # ---------------------------------------------------------------------------
  # The external gate.
  #
  # This job runs on every build. While Samsung's .NET 11 manifest is unavailable it
  # reports that external dependency truthfully and succeeds. The first time either
  # baseline-derived manifest ID becomes available, the same unconditional step installs
  # the supported workload and runs the real Tizen restore/build/pack lane. There is no
  # continue-on-error or conditionally skipped follow-up that can turn that transition
  # into a false green.
  # ---------------------------------------------------------------------------
  tizen-workload-gate:
    name: Tizen workload availability (external gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Probe and run the real Tizen lane when available
        run: ./eng/ci/tizen-workload-gate.sh
        env:
          ContinuousIntegrationBuild: true
