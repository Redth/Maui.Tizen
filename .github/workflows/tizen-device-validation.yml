name: Tizen device validation

# ---------------------------------------------------------------------------------------------
# The device lane.
#
# Covers everything that genuinely cannot be validated anywhere else: versioned net11.0-tizen
# builds, TPK creation, deploy and run, on-device mapper/Essentials assertions, visual baselines,
# lifecycle, and TV remote focus traversal.
#
# TWO INDEPENDENT GATES
#
#   1. The Samsung workload manifest is unpublished (eng/baselines.json > target.workloadManifest).
#   2. Device infrastructure is not attached to ordinary pull requests.
#
# POLICY
#
#   Pull requests : tolerated when unavailable. Reports "not run" and does not block.
#   Release       : required. `release-gate` fails unless EVERY required profile actually ran on
#                   hardware and passed.
#
# HOW "NOT RUN" IS PREVENTED FROM LOOKING LIKE "PASSED"
#
# A matrix job whose steps are all conditioned out still reports success, so the gate cannot infer
# anything from the job result alone - that was a real hole found in review. Instead every profile
# writes a result file recording whether the lane was available and whether it passed, and the gate
# requires one per profile. Artifacts rather than job outputs, because matrix job outputs collapse
# to a single last-writer-wins value and a passing profile would mask a skipped one.
#
# The decision itself lives in eng/validation/scripts/evaluate-release-gate.sh so it can be tested;
# see Maui.Tizen.Validation.Tests.ReleaseGateTests for the truth table.
#
# NO SECRETS OR PERSONAL INFRASTRUCTURE LIVE IN THIS FILE.
# ---------------------------------------------------------------------------------------------

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_validation:
        type: boolean
        required: true
      package_version:
        type: string
        required: true
      unsigned_artifact_id:
        type: string
        required: true
      unsigned_artifact_name:
        type: string
        required: true
      unsigned_artifact_digest:
        type: string
        required: true
      unsigned_manifest_sha256:
        type: string
        required: true
      source_sha:
        type: string
        required: true
      source_ref:
        type: string
        required: true
      source_run_id:
        type: string
        required: true
      source_run_attempt:
        type: string
        required: true
      workload_id:
        type: string
        required: true
      workload_version:
        type: string
        required: true
      workload_package_sha256:
        type: string
        required: true
      workload_signer_fingerprint:
        type: string
        required: true
    outputs:
      gate_passed:
        description: >-
          'true' only when every required profile ran on hardware and passed. Fail-closed: any other
          outcome, including the workflow erroring before the gate runs, leaves this unset, which a
          caller must treat as a failure.
        value: ${{ jobs.release-gate.outputs.gate_passed }}
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  source-guard:
    name: Verify device workflow source
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      source_ref: ${{ steps.source.outputs.source_ref }}
      release_validation: ${{ steps.source.outputs.release_validation }}
    steps:
      - name: Reject arbitrary refs and incomplete release inputs
        id: source
        env:
          ACTUAL_REPOSITORY: ${{ github.repository }}
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_VALIDATION: ${{ inputs.release_validation }}
          REQUESTED_SHA: ${{ inputs.source_sha }}
          REQUESTED_REF: ${{ inputs.source_ref }}
          REQUESTED_RUN_ID: ${{ inputs.source_run_id }}
          REQUESTED_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          PACKAGE_VERSION: ${{ inputs.package_version }}
          ARTIFACT_ID: ${{ inputs.unsigned_artifact_id }}
          ARTIFACT_NAME: ${{ inputs.unsigned_artifact_name }}
          ARTIFACT_DIGEST: ${{ inputs.unsigned_artifact_digest }}
          MANIFEST_SHA256: ${{ inputs.unsigned_manifest_sha256 }}
          WORKLOAD_ID: ${{ inputs.workload_id }}
          WORKLOAD_VERSION: ${{ inputs.workload_version }}
          WORKLOAD_PACKAGE_SHA256: ${{ inputs.workload_package_sha256 }}
          WORKLOAD_SIGNER_FINGERPRINT: ${{ inputs.workload_signer_fingerprint }}
        run: |
          set -euo pipefail
          expected_repository="Redth/Maui.Tizen"
          if [[ "$ACTUAL_REPOSITORY" != "$expected_repository" ]]; then
            echo "::error::This reusable workflow only trusts Redth/Maui.Tizen callers."
            exit 1
          fi
          default_ref="refs/heads/$DEFAULT_BRANCH"
          if [[ "$GITHUB_REF" != "$default_ref" ]]; then
            echo "::error::The device workflow may run only from the current default branch."
            exit 1
          fi

          source_sha="$GITHUB_SHA"
          source_ref="$GITHUB_REF"
          release_validation=false
          if [[ "$RELEASE_VALIDATION" == "true" ]]; then
            release_validation=true
            required=(
              "$REQUESTED_SHA" "$REQUESTED_REF" "$REQUESTED_RUN_ID"
              "$REQUESTED_RUN_ATTEMPT" "$PACKAGE_VERSION" "$ARTIFACT_ID"
              "$ARTIFACT_NAME" "$ARTIFACT_DIGEST" "$MANIFEST_SHA256"
              "$WORKLOAD_ID" "$WORKLOAD_VERSION" "$WORKLOAD_PACKAGE_SHA256"
              "$WORKLOAD_SIGNER_FINGERPRINT"
            )
            for value in "${required[@]}"; do
              [[ -n "$value" ]] || {
                echo "::error::Release validation is missing an immutable artifact/source input."
                exit 1
              }
            done
            [[ "$REQUESTED_SHA" == "$GITHUB_SHA" ]]
            [[ "$REQUESTED_REF" == "$GITHUB_REF" ]]
            [[ "$REQUESTED_RUN_ID" == "$GITHUB_RUN_ID" ]]
            [[ "$REQUESTED_RUN_ATTEMPT" == "$GITHUB_RUN_ATTEMPT" ]]
            [[ "$CALLER_WORKFLOW_REF" == "$expected_repository/.github/workflows/release.yml@$GITHUB_REF" ]]
            source_sha="$REQUESTED_SHA"
            source_ref="$REQUESTED_REF"
          elif [[ "$CALLER_WORKFLOW_REF" != "$expected_repository/.github/workflows/tizen-device-validation.yml@$GITHUB_REF" ]]; then
            echo "::error::Direct device validation must execute this reviewed workflow."
            exit 1
          fi

          {
            echo "source_sha=$source_sha"
            echo "source_ref=$source_ref"
            echo "release_validation=$release_validation"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Runs on a hosted runner so an offline self-hosted agent produces "unavailable"
  # rather than leaving the whole workflow queued indefinitely.
  # ---------------------------------------------------------------------------
  availability:
    name: Device lane availability
    needs: source-guard
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
      required: ${{ steps.check.outputs.required }}
      required_profiles: ${{ steps.check.outputs.required_profiles }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: Redth/Maui.Tizen
          ref: ${{ needs.source-guard.outputs.source_sha }}
          persist-credentials: false

      - name: Determine availability, requirement and required profiles
        id: check
        env:
          LAB_ENABLED: ${{ vars.TIZEN_DEVICE_LAB_ENABLED }}
          PACKAGE_VERSION: ${{ inputs.package_version }}
          RELEASE_VALIDATION: ${{ inputs.release_validation }}
          WORKLOAD_ID: ${{ inputs.workload_id }}
          WORKLOAD_PACKAGE_SHA256: ${{ inputs.workload_package_sha256 }}
          WORKLOAD_SIGNER_FINGERPRINT: ${{ inputs.workload_signer_fingerprint }}
          WORKLOAD_VERSION: ${{ inputs.workload_version }}
        run: |
          set -euo pipefail

          enabled="$LAB_ENABLED"
          [ "$enabled" = "true" ] || enabled=false

          required=false
          [ "$RELEASE_VALIDATION" = "true" ] && required=true

          if [ "$required" = "true" ]; then
            ./eng/release/release-contract.py validate-version \
              --version "$PACKAGE_VERSION"
            ./eng/release/release-contract.py verify-workload-contract \
              --workload-id "$WORKLOAD_ID" \
              --workload-version "$WORKLOAD_VERSION" \
              --package-sha256 "$WORKLOAD_PACKAGE_SHA256" \
              --signer-fingerprint "$WORKLOAD_SIGNER_FINGERPRINT"
          fi

          # Derived from the profile matrix rather than hard-coded, so adding a release-gating
          # profile automatically starts gating releases.
          required_profiles="$(python3 -c "
          import json
          m = json.load(open('eng/validation/profiles/tizen-profiles.json'))
          print(' '.join(
              f\"{p['id']}-{density}\"
              for p in m['profiles'] if p.get('gatesRelease')
              for density in p['densities']))
          ")"

          {
            echo "enabled=$enabled"
            echo "required=$required"
            echo "required_profiles=$required_profiles"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Device lane availability"
            echo
            echo "- lab enabled: \`$enabled\`"
            echo "- required for this run: \`$required\`"
            echo "- required profiles: \`$required_profiles\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # The matrix. Profiles come from eng/validation/profiles/tizen-profiles.json, the same file
  # that drives the baseline layout and the catalog test plan.
  # ---------------------------------------------------------------------------
  device-matrix:
    name: ${{ matrix.profile }} / ${{ matrix.density }} / ${{ matrix.tfm }}
    needs: [source-guard, availability]
    if: needs.availability.outputs.enabled == 'true'
    runs-on:
      group: maui-tizen-release
      labels: tizen
    environment: tizen-device-lab
    permissions:
      actions: read
      contents: read
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # One profile at a time. Even with distinct host ports, two jobs on the same runner would
      # contend for sdb and for the single attached target of each kind.
      max-parallel: 1
      matrix:
        include:
          # Each density/resolution is a separately configured target. A single unchanged device
          # must never be captured repeatedly and relabelled as several visual variants.
          - profile: mobile
            density: mdpi
            tfm: net11.0-tizen11.0
            serial_var: TIZEN_MOBILE_MDPI_SERIAL
            home_app_var: TIZEN_MOBILE_HOME_APP_ID
            host_port: 9223
          - profile: mobile
            density: hdpi
            tfm: net11.0-tizen11.0
            serial_var: TIZEN_MOBILE_HDPI_SERIAL
            home_app_var: TIZEN_MOBILE_HOME_APP_ID
            host_port: 9224
          - profile: mobile
            density: xhdpi
            tfm: net11.0-tizen11.0
            serial_var: TIZEN_MOBILE_XHDPI_SERIAL
            home_app_var: TIZEN_MOBILE_HOME_APP_ID
            host_port: 9225
          - profile: tv
            density: fhd
            tfm: net11.0-tizen11.0
            serial_var: TIZEN_TV_FHD_SERIAL
            home_app_var: TIZEN_TV_HOME_APP_ID
            host_port: 9226
          - profile: tv
            density: uhd
            tfm: net11.0-tizen11.0
            serial_var: TIZEN_TV_UHD_SERIAL
            home_app_var: TIZEN_TV_HOME_APP_ID
            host_port: 9227
    env:
      RELEASE_PACKAGE_VERSION: ${{ inputs.package_version }}
      RELEASE_ARTIFACT_DIGEST: ${{ inputs.unsigned_artifact_digest }}
      RELEASE_ARTIFACT_ID: ${{ inputs.unsigned_artifact_id }}
      RELEASE_ARTIFACT_NAME: ${{ inputs.unsigned_artifact_name }}
      RELEASE_MANIFEST_SHA256: ${{ inputs.unsigned_manifest_sha256 }}
      RELEASE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
      RELEASE_RUN_ID: ${{ inputs.source_run_id }}
      RELEASE_SOURCE_REF: ${{ inputs.source_ref }}
      RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_WORKLOAD_ID: ${{ inputs.workload_id }}
      RELEASE_WORKLOAD_PACKAGE_SHA256: ${{ inputs.workload_package_sha256 }}
      RELEASE_WORKLOAD_SIGNER_FINGERPRINT: ${{ inputs.workload_signer_fingerprint }}
      RELEASE_WORKLOAD_VERSION: ${{ inputs.workload_version }}
      TIZEN_PROFILE: ${{ matrix.profile }}
      TIZEN_DENSITY: ${{ matrix.density }}
      TIZEN_TFM: ${{ matrix.tfm }}
      RESULT_FILE: artifacts/device-results/device-result-${{ matrix.profile }}-${{ matrix.density }}.txt
      TIZEN_DEVICE_SERIAL: ${{ vars[matrix.serial_var] }}
      TIZEN_REQUIRED_SERIALS: ${{ vars.TIZEN_MOBILE_MDPI_SERIAL }},${{ vars.TIZEN_MOBILE_HDPI_SERIAL }},${{ vars.TIZEN_MOBILE_XHDPI_SERIAL }},${{ vars.TIZEN_TV_FHD_SERIAL }},${{ vars.TIZEN_TV_UHD_SERIAL }}
      # Distinct host ports so a leaked forward from one profile cannot capture the other's traffic.
      DEVFLOW_HOST_PORT: ${{ matrix.host_port }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: Redth/Maui.Tizen
          ref: ${{ needs.source-guard.outputs.source_sha }}
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Start the result record
        run: |
          set -euo pipefail
          mkdir -p artifacts/device-results
          # Written up front and overwritten on success, so a job that dies mid-way still leaves
          # a record that says it did not pass.
          printf 'profile=%s\ndensity=%s\npackage_version=%s\nartifact_digest=%s\nworkload_manifest=%s/%s\nlane_available=false\nstatus=incomplete\n' \
            "$TIZEN_PROFILE" \
            "$TIZEN_DENSITY" \
            "$RELEASE_PACKAGE_VERSION" \
            "$RELEASE_ARTIFACT_DIGEST" \
            "$RELEASE_WORKLOAD_ID" \
            "$RELEASE_WORKLOAD_VERSION" > "$RESULT_FILE"

      - name: Verify unsigned artifact API identity
        if: inputs.release_validation == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$RELEASE_ARTIFACT_ID" \
            > artifact.json
          ./eng/release/release-contract.py verify-artifact-metadata \
            --metadata artifact.json \
            --artifact-id "$RELEASE_ARTIFACT_ID" \
            --name "$RELEASE_ARTIFACT_NAME" \
            --digest "$RELEASE_ARTIFACT_DIGEST" \
            --run-id "$RELEASE_RUN_ID" \
            --run-attempt "$RELEASE_RUN_ATTEMPT" \
            --source-commit "$RELEASE_SOURCE_SHA" \
            --source-ref "$RELEASE_SOURCE_REF"

      - name: Download the exact unsigned release artifact
        if: inputs.release_validation == true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ inputs.unsigned_artifact_id }}
          merge-multiple: true
          path: artifacts/packages

      - name: Verify exact package bytes and reviewed Samsung workload
        if: inputs.release_validation == true
        run: |
          set -euo pipefail
          test "$(shasum -a 256 artifacts/packages/release-manifest.json | cut -d' ' -f1)" \
            = "$RELEASE_MANIFEST_SHA256"
          ./eng/release/release-contract.py verify-unsigned-manifest \
            --packages-dir artifacts/packages \
            --manifest artifacts/packages/release-manifest.json \
            --repository "$GITHUB_REPOSITORY" \
            --version "$RELEASE_PACKAGE_VERSION" \
            --source-commit "$RELEASE_SOURCE_SHA" \
            --source-ref "$RELEASE_SOURCE_REF" \
            --run-id "$RELEASE_RUN_ID" \
            --run-attempt "$RELEASE_RUN_ATTEMPT" \
            --artifact-name "$RELEASE_ARTIFACT_NAME"
          ./eng/release/release-contract.py verify-installed-workload \
            --workload-id "$RELEASE_WORKLOAD_ID" \
            --workload-version "$RELEASE_WORKLOAD_VERSION" \
            --package-sha256 "$RELEASE_WORKLOAD_PACKAGE_SHA256" \
            --signer-fingerprint "$RELEASE_WORKLOAD_SIGNER_FINGERPRINT"
          ./eng/release/release-contract.py write-nuget-config \
            --base nuget.config \
            --packages-dir artifacts/packages \
            --output artifacts/release-nuget.config

      - name: Preflight
        id: preflight
        run: ./eng/validation/scripts/tizen-device-lane.sh preflight

      - name: Record lane availability
        env:
          LANE_AVAILABLE: ${{ steps.preflight.outputs.lane_available }}
        run: |
          set -euo pipefail
          printf 'profile=%s\ndensity=%s\npackage_version=%s\nartifact_digest=%s\nworkload_manifest=%s/%s\nlane_available=%s\nstatus=%s\n' \
            "$TIZEN_PROFILE" \
            "$TIZEN_DENSITY" \
            "$RELEASE_PACKAGE_VERSION" \
            "$RELEASE_ARTIFACT_DIGEST" \
            "$RELEASE_WORKLOAD_ID" \
            "$RELEASE_WORKLOAD_VERSION" \
            "$LANE_AVAILABLE" \
            "$([ "$LANE_AVAILABLE" = "true" ] && echo running || echo skipped)" \
            > "$RESULT_FILE"

      - name: Fail fast when a release needs hardware that is not present
        if: needs.availability.outputs.required == 'true' && steps.preflight.outputs.lane_available != 'true'
        run: |
          echo "::error::A release requires profile '$TIZEN_PROFILE' to run on hardware, but"
          echo "::error::the lane is unavailable. See the preflight output above."
          exit 1

      # -------------------------------------------------------------------------------------
      # The application under test.
      #
      # Its location is a repository variable, not a hard-coded path: the catalog application
      # does not exist yet, and a workflow that builds a phantom project looks plausible for as
      # long as the job never runs. WorkflowReferenceTests asserts no workflow references a
      # missing path, which is why this is a variable rather than a literal.
      # -------------------------------------------------------------------------------------
      - name: Resolve the application under test
        id: app
        if: steps.preflight.outputs.lane_available == 'true'
        env:
          CATALOG_PROJECT: ${{ vars.TIZEN_CATALOG_PROJECT }}
        run: |
          set -euo pipefail
          project="$CATALOG_PROJECT"

          if [ -z "$project" ] || [ ! -f "$project" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            printf 'profile=%s\ndensity=%s\npackage_version=%s\nartifact_digest=%s\nworkload_manifest=%s/%s\nlane_available=false\nstatus=skipped\nreason=no_app\n' \
              "$TIZEN_PROFILE" \
              "$TIZEN_DENSITY" \
              "$RELEASE_PACKAGE_VERSION" \
              "$RELEASE_ARTIFACT_DIGEST" \
              "$RELEASE_WORKLOAD_ID" \
              "$RELEASE_WORKLOAD_VERSION" > "$RESULT_FILE"
            echo "::warning::No application under test. Set the TIZEN_CATALOG_PROJECT repository"
            echo "::warning::variable to a real project path once the catalog application exists."
            exit 0
          fi

          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "project=$project" >> "$GITHUB_OUTPUT"

      - name: Require the application under test for a release
        if: needs.availability.outputs.required == 'true' && steps.preflight.outputs.lane_available == 'true' && steps.app.outputs.available != 'true'
        run: |
          echo "::error::A release requires a real application under test. Set TIZEN_CATALOG_PROJECT"
          echo "::error::to the catalog application project. See samples/Maui.Tizen.Catalog/README.md."
          exit 1

      - name: Build and package the application
        if: steps.app.outputs.available == 'true'
        env:
          CATALOG_PROJECT: ${{ steps.app.outputs.project }}
          MAUI_TIZEN_RELEASE_NUGET_CONFIG: ${{ inputs.release_validation == true && 'artifacts/release-nuget.config' || '' }}
          NUGET_PACKAGES: ${{ runner.temp }}/maui-tizen-nuget-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.profile }}-${{ matrix.density }}
        run: ./eng/validation/scripts/tizen-device-lane.sh build "$CATALOG_PROJECT"

      # Installing does not start anything. The previous version installed, forwarded and then
      # queried the agent, which could only have worked if something else had already launched
      # the app. The wait is equally load-bearing: the agent binds its port during startup, so a
      # query issued immediately after launch fails in a way that looks like a broken tunnel.
      - name: Deploy, launch, tunnel and wait for the agent
        if: steps.app.outputs.available == 'true'
        env:
          APP_ID: ${{ vars.TIZEN_CATALOG_APP_ID }}
        run: |
          set -euo pipefail
          tpk="$(find artifacts -name '*.tpk' -print -quit)"
          ./eng/validation/scripts/tizen-device-lane.sh install "$tpk"
          ./eng/validation/scripts/tizen-device-lane.sh launch
          ./eng/validation/scripts/tizen-device-lane.sh forward
          ./eng/validation/scripts/tizen-device-lane.sh wait-for-agent
          ./eng/validation/scripts/tizen-device-lane.sh agent-status
          ./eng/validation/scripts/tizen-device-lane.sh verify-device-profile
          ./eng/validation/scripts/tizen-device-lane.sh verify-visual-target

      # -------------------------------------------------------------------------------------
      # On-device assertions.
      #
      # These run INSIDE the deployed application and report back over DevFlow. Running the
      # hosted validation script here instead would execute on the controller, where the Tizen
      # backend is not loaded, so the mapper-parity and Essentials suites would skip exactly as
      # they do on a hosted runner - a device lane that validated nothing.
      # -------------------------------------------------------------------------------------
      - name: On-device conventions (mapper parity, Essentials coverage)
        if: steps.app.outputs.available == 'true'
        run: ./eng/validation/scripts/tizen-device-lane.sh device-assertions

      - name: Lifecycle harness
        if: steps.app.outputs.available == 'true'
        env:
          APP_ID: ${{ vars.TIZEN_CATALOG_APP_ID }}
          HOME_APP_ID: ${{ vars[matrix.home_app_var] }}
        run: ./eng/validation/scripts/tizen-device-lane.sh lifecycle

      - name: TV remote focus traversal
        if: steps.app.outputs.available == 'true' && matrix.profile == 'tv'
        run: ./eng/validation/scripts/tizen-device-lane.sh remote-focus

      # Only device-specific work runs on lab hardware. The hosted suites already ran on
      # ubuntu-latest; repeating them here would consume scarce device time to re-prove something
      # that has nothing to do with the device.
      - name: Capture and compare visual baselines
        if: steps.app.outputs.available == 'true'
        run: ./eng/validation/scripts/tizen-device-lane.sh baselines

      - name: Record the result
        if: always() && steps.preflight.outputs.lane_available == 'true' && steps.app.outputs.available == 'true'
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          status="$([ "$JOB_STATUS" = "success" ] && echo pass || echo fail)"
          printf 'profile=%s\ndensity=%s\npackage_version=%s\nartifact_digest=%s\nworkload_manifest=%s/%s\nlane_available=true\nstatus=%s\n' \
            "$TIZEN_PROFILE" \
            "$TIZEN_DENSITY" \
            "$RELEASE_PACKAGE_VERSION" \
            "$RELEASE_ARTIFACT_DIGEST" \
            "$RELEASE_WORKLOAD_ID" \
            "$RELEASE_WORKLOAD_VERSION" \
            "$status" > "$RESULT_FILE"

      - name: Always tear the tunnel down
        if: always()
        run: ./eng/validation/scripts/tizen-device-lane.sh unforward || true

      - name: Upload the profile result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: device-result-${{ matrix.profile }}-${{ matrix.density }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/device-results/
          if-no-files-found: error

      # Screenshots and diffs are uploaded whatever the outcome: on failure they are the evidence,
      # and on success they are what a reviewer needs to approve an intentional visual change.
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: device-diagnostics-${{ matrix.profile }}-${{ matrix.density }}-${{ matrix.tfm }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            artifacts/test-results/
            artifacts/visual-diffs/
            artifacts/screenshots/
          if-no-files-found: ignore

  package-consumer:
    name: Restore exact release packages on Tizen workload
    needs: [source-guard, availability, device-matrix]
    if: needs.availability.outputs.required == 'true' && needs.availability.outputs.enabled == 'true' && needs.device-matrix.result == 'success'
    runs-on:
      group: maui-tizen-release
      labels: tizen
    environment: tizen-device-lab
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    env:
      RELEASE_ARTIFACT_DIGEST: ${{ inputs.unsigned_artifact_digest }}
      RELEASE_ARTIFACT_ID: ${{ inputs.unsigned_artifact_id }}
      RELEASE_ARTIFACT_NAME: ${{ inputs.unsigned_artifact_name }}
      RELEASE_MANIFEST_SHA256: ${{ inputs.unsigned_manifest_sha256 }}
      RELEASE_PACKAGE_VERSION: ${{ inputs.package_version }}
      RELEASE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
      RELEASE_RUN_ID: ${{ inputs.source_run_id }}
      RELEASE_SOURCE_REF: ${{ inputs.source_ref }}
      RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_WORKLOAD_ID: ${{ inputs.workload_id }}
      RELEASE_WORKLOAD_PACKAGE_SHA256: ${{ inputs.workload_package_sha256 }}
      RELEASE_WORKLOAD_SIGNER_FINGERPRINT: ${{ inputs.workload_signer_fingerprint }}
      RELEASE_WORKLOAD_VERSION: ${{ inputs.workload_version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: Redth/Maui.Tizen
          ref: ${{ needs.source-guard.outputs.source_sha }}
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Verify unsigned artifact API identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$RELEASE_ARTIFACT_ID" \
            > artifact.json
          ./eng/release/release-contract.py verify-artifact-metadata \
            --metadata artifact.json \
            --artifact-id "$RELEASE_ARTIFACT_ID" \
            --name "$RELEASE_ARTIFACT_NAME" \
            --digest "$RELEASE_ARTIFACT_DIGEST" \
            --run-id "$RELEASE_RUN_ID" \
            --run-attempt "$RELEASE_RUN_ATTEMPT" \
            --source-commit "$RELEASE_SOURCE_SHA" \
            --source-ref "$RELEASE_SOURCE_REF"

      - name: Download exact unsigned release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ inputs.unsigned_artifact_id }}
          merge-multiple: true
          path: artifacts/packages

      - name: Verify exact package bytes and reviewed Samsung workload
        run: |
          set -euo pipefail
          test "$(shasum -a 256 artifacts/packages/release-manifest.json | cut -d' ' -f1)" \
            = "$RELEASE_MANIFEST_SHA256"
          ./eng/release/release-contract.py verify-unsigned-manifest \
            --packages-dir artifacts/packages \
            --manifest artifacts/packages/release-manifest.json \
            --repository "$GITHUB_REPOSITORY" \
            --version "$RELEASE_PACKAGE_VERSION" \
            --source-commit "$RELEASE_SOURCE_SHA" \
            --source-ref "$RELEASE_SOURCE_REF" \
            --run-id "$RELEASE_RUN_ID" \
            --run-attempt "$RELEASE_RUN_ATTEMPT" \
            --artifact-name "$RELEASE_ARTIFACT_NAME"
          ./eng/release/release-contract.py verify-installed-workload \
            --workload-id "$RELEASE_WORKLOAD_ID" \
            --workload-version "$RELEASE_WORKLOAD_VERSION" \
            --package-sha256 "$RELEASE_WORKLOAD_PACKAGE_SHA256" \
            --signer-fingerprint "$RELEASE_WORKLOAD_SIGNER_FINGERPRINT"

      - name: Restore the real package consumer
        env:
          MAUI_TIZEN_RELEASE_VALIDATION: '1'
          MAUI_TIZEN_SUITES: Maui.Tizen.Consumer.Tests
          NUGET_PACKAGES: ${{ runner.temp }}/maui-tizen-nuget-${{ github.run_id }}-${{ github.run_attempt }}-consumer
        run: ./eng/validation/run-hosted-validation.sh

  # ---------------------------------------------------------------------------
  # The gate. Point branch protection at this job for release branches.
  # ---------------------------------------------------------------------------
  release-gate:
    name: Device lane release gate
    needs: [source-guard, availability, device-matrix, package-consumer]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      CONSUMER_RESULT: ${{ needs.package-consumer.result }}
      LAB_ENABLED: ${{ needs.availability.outputs.enabled }}
      MATRIX_RESULT: ${{ needs.device-matrix.result }}
      RELEASE_ARTIFACT_DIGEST: ${{ inputs.unsigned_artifact_digest }}
      RELEASE_ARTIFACT_ID: ${{ inputs.unsigned_artifact_id }}
      RELEASE_ARTIFACT_NAME: ${{ inputs.unsigned_artifact_name }}
      RELEASE_MANIFEST_SHA256: ${{ inputs.unsigned_manifest_sha256 }}
      RELEASE_PACKAGE_VERSION: ${{ inputs.package_version }}
      RELEASE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
      RELEASE_RUN_ID: ${{ inputs.source_run_id }}
      RELEASE_SOURCE_REF: ${{ inputs.source_ref }}
      RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_VALIDATION: ${{ inputs.release_validation }}
      RELEASE_WORKLOAD_ID: ${{ inputs.workload_id }}
      RELEASE_WORKLOAD_VERSION: ${{ inputs.workload_version }}
      REQUIRED: ${{ needs.availability.outputs.required }}
      REQUIRED_PROFILES: ${{ needs.availability.outputs.required_profiles }}
    outputs:
      gate_passed: ${{ steps.evaluate.outputs.gate_passed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: Redth/Maui.Tizen
          ref: ${{ needs.source-guard.outputs.source_sha }}
          persist-credentials: false

      - name: Download per-profile results
        if: needs.availability.outputs.enabled == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: device-result-*-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          merge-multiple: true
          path: artifacts/device-results
        continue-on-error: true

      - name: Verify unsigned artifact API identity
        if: needs.availability.outputs.required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$RELEASE_ARTIFACT_ID" \
            > artifact.json
          ./eng/release/release-contract.py verify-artifact-metadata \
            --metadata artifact.json \
            --artifact-id "$RELEASE_ARTIFACT_ID" \
            --name "$RELEASE_ARTIFACT_NAME" \
            --digest "$RELEASE_ARTIFACT_DIGEST" \
            --run-id "$RELEASE_RUN_ID" \
            --run-attempt "$RELEASE_RUN_ATTEMPT" \
            --source-commit "$RELEASE_SOURCE_SHA" \
            --source-ref "$RELEASE_SOURCE_REF"

      - name: Download exact unsigned release artifact
        if: needs.availability.outputs.required == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ inputs.unsigned_artifact_id }}
          merge-multiple: true
          path: artifacts/packages

      - name: Set up .NET
        if: needs.availability.outputs.required == 'true'
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Verify exact unsigned manifest
        if: needs.availability.outputs.required == 'true'
        run: |
          set -euo pipefail
          test "$(shasum -a 256 artifacts/packages/release-manifest.json | cut -d' ' -f1)" \
            = "$RELEASE_MANIFEST_SHA256"
          ./eng/release/release-contract.py verify-unsigned-manifest \
            --packages-dir artifacts/packages \
            --manifest artifacts/packages/release-manifest.json \
            --repository "$GITHUB_REPOSITORY" \
            --version "$RELEASE_PACKAGE_VERSION" \
            --source-commit "$RELEASE_SOURCE_SHA" \
            --source-ref "$RELEASE_SOURCE_REF" \
            --run-id "$RELEASE_RUN_ID" \
            --run-attempt "$RELEASE_RUN_ATTEMPT" \
            --artifact-name "$RELEASE_ARTIFACT_NAME"

      # Cross-profile readiness belongs HERE, not inside the matrix.
      #
      # Run per profile, these gates read a result file that still says status=running for the
      # current profile and cannot see the other profile's artifact at all, so they could only ever
      # fail. They are inherently cross-profile assertions and need every profile finalised first.
      - name: Release readiness gates
        if: needs.availability.outputs.required == 'true'
        env:
          MAUI_TIZEN_RELEASE_VALIDATION: '1'
          MAUI_TIZEN_SUITES: >-
            Maui.Tizen.Validation.Tests Maui.Tizen.Build.Tests
            Maui.Tizen.Conventions.Tests Maui.Tizen.DevFlow.Tests
        run: ./eng/validation/run-hosted-validation.sh

      - name: Evaluate
        id: evaluate
        run: |
          set -euo pipefail
          mkdir -p artifacts/device-results

          ./eng/validation/scripts/evaluate-release-gate.sh \
            --required "$REQUIRED" \
            --release-validation "$RELEASE_VALIDATION" \
            --lab-enabled "$LAB_ENABLED" \
            --matrix-result "$MATRIX_RESULT" \
            --consumer-result "$CONSUMER_RESULT" \
            --required-profiles "$REQUIRED_PROFILES" \
            --package-version "$RELEASE_PACKAGE_VERSION" \
            --artifact-digest "$RELEASE_ARTIFACT_DIGEST" \
            --workload-manifest "$RELEASE_WORKLOAD_ID/$RELEASE_WORKLOAD_VERSION" \
            --results-dir artifacts/device-results | tee gate.log

      - name: Summarise
        if: always()
        run: |
          {
            echo "## Device lane release gate"
            echo
            echo '```'
            cat gate.log 2>/dev/null || echo "(gate did not produce output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
